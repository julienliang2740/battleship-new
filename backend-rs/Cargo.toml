[package]
name = "battleship-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "battleship-backend"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
thiserror = "1"

[profile.release]
opt-level = 3
lto = "thin"
